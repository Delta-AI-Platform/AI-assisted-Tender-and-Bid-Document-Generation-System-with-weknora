[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deta-bid-agent"
version = "0.1.0"
description = "Persistent, tool-driven agent for evidence-based bid document production"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["bid_agent*"]
